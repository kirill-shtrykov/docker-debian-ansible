name: Publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - "debian-12/**"
      - "debian-13/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: matrix
        shell: bash
        run: |
          images=()

          if git diff --quiet HEAD^ HEAD -- debian-12; then
            :
          else
            images+=('{"name":"12","path":"debian-12"}')
          fi

          if git diff --quiet HEAD^ HEAD -- debian-13; then
            :
          else
            images+=('{"name":"13","path":"debian-13"}')
          fi

          matrix=$(printf '%s\n' "${images[@]}" | jq -s -c '{include: .}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Changed images: $matrix"

  publish:
    name: Publish Debian ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kirillshtrykov/debian-ansible
          tags: |
            type=raw,value=${{ matrix.name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
